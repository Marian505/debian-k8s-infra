apiVersion: v1
kind: ConfigMap
metadata:
  name: kibana-config
  namespace: dev
data:
  kibana.yml: |
    server.name: kibana
    server.host: "0.0.0.0"
    elasticsearch.hosts: ["http://elasticsearch.dev.svc.cluster.local:9200"]
    server.basePath: "/kibana"
    server.publicBaseUrl: "http://localhost/kibana"
    server.rewriteBasePath: true
